name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install zsh and a virtual display (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y zsh xvfb

      # The runner image has group/world-writable folders in zsh's function
      # path, so Ubuntu's global compinit stops every new zsh with an
      # "insecure directories" y/n prompt. Tighten them, as zsh recommends.
      - name: Fix insecure zsh completion folders (Linux)
        if: runner.os == 'Linux'
        run: |
          dirs=$(zsh -c 'autoload -Uz compaudit; compaudit' 2>/dev/null || true)
          if [ -n "$dirs" ]; then echo "$dirs"; echo "$dirs" | xargs sudo chmod g-w,o-w; fi

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies (fails on high or critical)
        run: npm audit --audit-level=high

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      - name: End-to-end tests (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:e2e:all

      - name: End-to-end tests (macOS)
        if: runner.os == 'macOS'
        run: npm run test:e2e:all
